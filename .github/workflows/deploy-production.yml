name: Deploy Frontend Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mobee-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Frontend
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOF'
            set -e

            export PATH=/www/server/nodejs/v24.20.0/bin:$PATH

            cd /www/projects/Mobee-Suite-Frontend

            echo "1. Updating source code..."
            git fetch origin main
            git reset --hard origin/main

            echo "2. Installing dependencies..."
            npm ci

            echo "3. Building production frontend..."
            npm run build

            echo "4. Publishing website..."
            rsync -a \
              --delete \
              --exclude='.well-known/' \
              dist/ \
              /www/wwwroot/suite.mobee.lk/

            chown -R www:www /www/wwwroot/suite.mobee.lk

            echo "5. Testing website..."
            curl -fsS https://suite.mobee.lk > /dev/null

            echo "Frontend deployed successfully"
          EOF