name: Deploy Frontend Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mobee-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Frontend
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOF'
            set -Eeuo pipefail

            export PATH=/www/server/nodejs/v24.20.0/bin:$PATH

            PROJECT_DIR="/www/projects/Mobee-Suite-Frontend"
            WEB_DIR="/www/wwwroot/suite.mobee.lk"

            echo "========================================"
            echo "1. Updating frontend source code"
            echo "========================================"

            cd "$PROJECT_DIR"

            git fetch origin main
            git reset --hard origin/main

            echo "========================================"
            echo "2. Installing dependencies"
            echo "========================================"

            npm ci

            echo "========================================"
            echo "3. Building production frontend"
            echo "========================================"

            npm run build

            echo "========================================"
            echo "4. Checking build output"
            echo "========================================"

            test -f dist/index.html

            echo "========================================"
            echo "5. Publishing frontend"
            echo "========================================"

            rsync -a \
              --delete \
              --chown=www:www \
              --exclude='.well-known/' \
              --exclude='.user.ini' \
              --exclude='.htaccess' \
              dist/ \
              "$WEB_DIR/"

            echo "========================================"
            echo "6. Testing production website"
            echo "========================================"

            curl -fsS https://suite.mobee.lk/ > /dev/null

            echo ""
            echo "========================================"
            echo "Frontend deployment successful"
            echo "========================================"
          EOF